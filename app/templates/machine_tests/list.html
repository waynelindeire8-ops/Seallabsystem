{% extends "base.html" %}
{% block title %}Machine Tests - Seal MW Lab System{% endblock %}
{% block page_title %}Machine Tests{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search machines..." style="width:300px">
    <a href="/machine-tests/form" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Machine</a>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>Machine</th><th>Code</th><th>Test</th><th>Manufacturer</th><th>Model</th><th>Status</th><th></th></tr></thead>
                <tbody id="listData"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadData() {
        var data = await apiGet('/machine-tests/api');
        if (!data) return;
        var tbody = document.getElementById('listData');
        if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><p>No machines</p></td></tr>'; return; }
        tbody.innerHTML = data.map(function(r) {
            var statusBadge = r.status === 'active' ? '<span class="badge bg-success">Active</span>' : r.status === 'maintenance' ? '<span class="badge bg-warning text-dark">Maintenance</span>' : '<span class="badge bg-secondary">Inactive</span>';
            return '<tr><td><strong>' + r.machine_name + '</strong></td><td>' + (r.machine_code || '-') + '</td><td>' + (r.test_name || '-') + '</td><td>' + (r.manufacturer || '-') + '</td><td>' + (r.model || '-') + '</td><td>' + statusBadge + '</td><td><a href="/machine-tests/form/' + r.id + '" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a><button class="btn btn-sm btn-outline-danger" onclick="deleteItem(' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
        }).join('');
    }
    async function deleteItem(id) { if (await confirmAction('Delete this machine?')) { var res = await apiDelete('/machine-tests/api/' + id); if (res && res.ok) { showToast('Deleted'); loadData(); } } }
    loadData();
</script>
{% endblock %}
