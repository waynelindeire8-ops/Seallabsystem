{% extends "base.html" %}
{% block title %}Patient Form - Seal MW Lab System{% endblock %}
{% block page_title %}Add/Edit Patient{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <form id="patientForm">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Patient Name *</label>
                            <input type="text" class="form-control" id="patientName" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Active</label>
                            <select class="form-select" id="patientActive">
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" id="patientPhone">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="patientEmail">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" id="patientAddress" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Patient</button>
                        <a href="/patients" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    var pathParts = window.location.pathname.split('/');
    var patientId = pathParts[pathParts.length - 1] !== 'form' ? pathParts[pathParts.length - 1] : null;

    async function loadPatient() {
        if (!patientId) return;
        var data = await apiGet('/patients/api/' + patientId);
        if (!data) return;
        document.getElementById('patientName').value = data.name;
        document.getElementById('patientPhone').value = data.phone || '';
        document.getElementById('patientEmail').value = data.email || '';
        document.getElementById('patientAddress').value = data.address || '';
        document.getElementById('patientActive').value = data.active;
    }

    document.getElementById('patientForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var payload = {
            name: document.getElementById('patientName').value.trim(),
            contact_person: document.getElementById('patientName').value.trim(),
            phone: document.getElementById('patientPhone').value.trim(),
            email: document.getElementById('patientEmail').value.trim(),
            address: document.getElementById('patientAddress').value.trim(),
            active: parseInt(document.getElementById('patientActive').value)
        };

        var res;
        if (patientId) { res = await apiPut('/patients/api/' + patientId, payload); }
        else { res = await apiPost('/patients/api', payload); }
        if (res && res.ok) { showToast('Patient saved'); window.location.href = '/patients'; }
    });

    loadPatient();
</script>
{% endblock %}
