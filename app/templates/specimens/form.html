{% extends "base.html" %}
{% block title %}Specimen Form - Seal MW Lab System{% endblock %}
{% block page_title %}Add/Edit Specimen{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <form id="itemForm">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Specimen Name *</label>
                            <input type="text" class="form-control" id="itemName" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Active</label>
                            <select class="form-select" id="itemActive"><option value="1">Yes</option><option value="0">No</option></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Storage Requirements</label>
                            <input type="text" class="form-control" id="itemStorage" placeholder="e.g. Refrigerate 2-8C">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Shelf Life (hours)</label>
                            <input type="number" class="form-control" id="itemShelf" value="24">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Instructions</label>
                            <textarea class="form-control" id="itemInstructions" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="/specimens" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    var pathParts = window.location.pathname.split('/');
    var itemId = pathParts[pathParts.length - 1] !== 'form' ? pathParts[pathParts.length - 1] : null;
    async function loadItem() { if (!itemId) return; var d = await apiGet('/specimens/api/' + itemId); if (d) { document.getElementById('itemName').value = d.name; document.getElementById('itemStorage').value = d.storage_req || ''; document.getElementById('itemShelf').value = d.shelf_life_hrs; document.getElementById('itemInstructions').value = d.instructions || ''; document.getElementById('itemActive').value = d.active; } }
    document.getElementById('itemForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var payload = { name: document.getElementById('itemName').value.trim(), storage_req: document.getElementById('itemStorage').value.trim(), shelf_life_hrs: parseInt(document.getElementById('itemShelf').value), instructions: document.getElementById('itemInstructions').value.trim(), active: parseInt(document.getElementById('itemActive').value) };
        var res; if (itemId) { res = await apiPut('/specimens/api/' + itemId, payload); } else { res = await apiPost('/specimens/api', payload); }
        if (res && res.ok) { showToast('Saved'); window.location.href = '/specimens'; }
    });
    loadItem();
</script>
{% endblock %}
