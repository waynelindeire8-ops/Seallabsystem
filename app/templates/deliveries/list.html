{% extends "base.html" %}
{% block title %}Deliveries - Seal MW Lab System{% endblock %}
{% block page_title %}Deliveries{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search deliveries..." style="width:300px">
    <a href="/deliveries/form" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>New Delivery</a>
</div>
<div class="card"><div class="card-body p-0"><div class="table-responsive">
    <table class="table table-hover mb-0">
        <thead><tr><th>Code</th><th>Client</th><th>Date</th><th>Tracking</th><th>Status</th><th></th></tr></thead>
        <tbody id="listData"></tbody>
    </table>
</div></div></div>
{% endblock %}
{% block extra_js %}
<script>
    async function loadData() {
        var data = await apiGet('/deliveries/api');
        if (!data) return;
        var tbody = document.getElementById('listData');
        if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><p>No deliveries</p></td></tr>'; return; }
        tbody.innerHTML = data.map(function(r) {
            var st = r.status === 'delivered' ? '<span class="badge bg-success">Delivered</span>' : r.status === 'dispatched' ? '<span class="badge bg-info">Dispatched</span>' : r.status === 'cancelled' ? '<span class="badge bg-danger">Cancelled</span>' : '<span class="badge bg-warning text-dark">Pending</span>';
            return '<tr><td><strong>' + r.delivery_code + '</strong></td><td>' + (r.client_name || '-') + '</td><td>' + (r.delivery_date || '-') + '</td><td>' + (r.tracking_number || '-') + '</td><td>' + st + '</td><td><a href="/deliveries/form/' + r.id + '" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a><button class="btn btn-sm btn-outline-danger" onclick="deleteItem(' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
        }).join('');
    }
    async function deleteItem(id) { if (await confirmAction('Delete this delivery?')) { var res = await apiDelete('/deliveries/api/' + id); if (res && res.ok) { showToast('Deleted'); loadData(); } } }
    loadData();
</script>
{% endblock %}
