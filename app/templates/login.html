<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Lab Software</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
    <style>
        body { background: #f5f6f6; }
        .login-topbar { height: 70px; display: flex; align-items: center; padding: 0 34px; color: #fff; background: #3e92b8; }
        .login-topbar span { font-size: 30px; font-weight: 400; }
        .login-stage { min-height: calc(100vh - 70px); display: flex; align-items: center; justify-content: center; padding: 30px 16px; }
        .login-card { width: 100%; max-width: 420px; background: #fff; border: 1px solid #d6dadd; box-shadow: 0 7px 24px rgba(44, 57, 63, .08); }
        .login-card-header { padding: 24px 28px 20px; color: #5f9fbd; font-size: 22px; border-bottom: 1px solid #e1e4e5; }
        .login-card-body { padding: 28px; }
        .login-mark { width: 54px; height: 54px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; background: #3e92b8; font-size: 25px; }
        .login-label { display: block; margin-bottom: 6px; color: #555b5f; font-size: 13px; font-weight: 600; }
        .login-error { display: none; margin-bottom: 16px; padding: 10px 12px; color: #a43d45; background: #fbe8e9; border: 1px solid #f0c8cb; font-size: 13px; }
    </style>
</head>
<body>
    <header class="login-topbar"><span>Lab Software</span></header>
    <main class="login-stage">
        <section class="login-card">
            <div class="login-card-header text-center"><div class="login-mark"><i class="bi bi-beaker-fill"></i></div>Sign in to your lab</div>
            <div class="login-card-body">
                <div id="errorMsg" class="login-error" role="alert"></div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="login-label" for="username">Username</label>
                        <input class="form-control" type="text" id="username" autocomplete="username" required>
                    </div>
                    <div class="mb-4">
                        <label class="login-label" for="password">Password</label>
                        <input class="form-control" type="password" id="password" autocomplete="current-password" required>
                    </div>
                    <button class="btn btn-primary w-100 py-2" type="submit">Login</button>
                </form>
            </div>
        </section>
    </main>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errDiv = document.getElementById('errorMsg');
            errDiv.style.display = 'none';
            try {
                const res = await fetch('/auth/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard';
                } else {
                    errDiv.textContent = data.error || 'Login failed';
                    errDiv.style.display = 'block';
                }
            } catch (err) {
                errDiv.textContent = 'Connection error.';
                errDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
