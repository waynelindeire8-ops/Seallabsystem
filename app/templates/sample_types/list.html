{% extends "base.html" %}
{% block title %}Sample Types - Lab Software{% endblock %}
{% block page_title %}Sample Types{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search types..." style="width:300px">
    <a href="/sample-types/form" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Sample Type</a>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr><th>Name</th><th>Storage</th><th>Shelf Life</th><th>Instructions</th><th>Status</th><th></th></tr>
                </thead>
                <tbody id="typesList"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadTypes() {
        const data = await apiGet('/sample-types/api');
        if (!data) return;
        const tbody = document.getElementById('typesList');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><p>No sample types</p></td></tr>';
            return;
        }
        tbody.innerHTML = data.map(t => `
            <tr>
                <td><strong>${t.name}</strong></td>
                <td>${t.storage_req || '-'}</td>
                <td>${t.shelf_life_hrs} hrs</td>
                <td><small>${t.instructions || '-'}</small></td>
                <td>${t.active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}</td>
                <td>
                    <a href="/sample-types/form/${t.id}" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteType(${t.id})"><i class="bi bi-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    async function deleteType(id) {
        if (await confirmAction('Delete this sample type?')) {
            const res = await apiDelete('/sample-types/api/' + id);
            if (res && res.ok) { showToast('Sample type deleted'); loadTypes(); }
        }
    }

    loadTypes();
</script>
{% endblock %}
