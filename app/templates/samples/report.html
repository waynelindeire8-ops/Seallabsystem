<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Report - Lab Software</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #fff; }
        .report-container { max-width: 800px; margin: 0 auto; padding: 40px; }
        .report-header { border-bottom: 3px solid #2563eb; padding-bottom: 20px; margin-bottom: 24px; }
        .report-header h1 { font-size: 24px; color: #0f172a; margin-bottom: 4px; }
        .report-header p { color: #64748b; font-size: 14px; margin: 0; }
        .report-section { margin-bottom: 20px; }
        .report-section h3 { font-size: 16px; color: #1e40af; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 12px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; font-size: 14px; }
        .info-grid dt { color: #64748b; font-weight: 500; }
        .info-grid dd { color: #0f172a; font-weight: 600; margin-bottom: 4px; }
        .result-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .result-table th { background: #f1f5f9; padding: 10px 12px; text-align: left; font-weight: 600; color: #475569; border: 1px solid #e2e8f0; }
        .result-table td { padding: 10px 12px; border: 1px solid #e2e8f0; }
        .flagged { color: #dc2626; font-weight: 700; }
        .report-footer { border-top: 2px solid #e2e8f0; padding-top: 16px; margin-top: 32px; font-size: 12px; color: #94a3b8; }
        .signature-line { border-top: 1px solid #0f172a; width: 200px; margin-top: 40px; padding-top: 4px; font-size: 12px; }
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; }
            .report-container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="no-print" style="background:#f1f5f9;padding:12px 0;text-align:center;border-bottom:1px solid #e2e8f0">
        <button class="btn btn-primary btn-sm" onclick="window.print()"><i class="bi bi-printer me-1"></i>Print Report</button>
        <a href="javascript:history.back()" class="btn btn-secondary btn-sm">Back</a>
    </div>

    <div class="report-container" id="reportContent">
        <div class="text-center py-5 text-muted">Loading report...</div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        const sampleId = window.location.pathname.split('/')[2];

        async function loadReport() {
            const res = await apiGet('/samples/api/' + sampleId);
            if (!res || !res.sample) return;

            const s = res.sample;
            const tests = res.tests;
            const user = getUser();

            document.getElementById('reportContent').innerHTML = `
                <div class="report-header">
                    <h1>Lab Software</h1>
                    <p>Laboratory Test Report</p>
                </div>

                <div class="report-section">
                    <h3>Sample Information</h3>
                    <div class="info-grid">
                        <dt>Sample Code</dt><dd>${s.sample_code}</dd>
                        <dt>Date Registered</dt><dd>${formatDateTime(s.created_at)}</dd>
                        <dt>Patient Name</dt><dd>${s.patient_name}</dd>
                        <dt>Date of Birth</dt><dd>${s.patient_dob || '-'}</dd>
                        <dt>Gender</dt><dd>${s.patient_gender || '-'}</dd>
                        <dt>Sample Type</dt><dd>${s.type_name || '-'}</dd>
                        <dt>Client</dt><dd>${s.client_name || 'Walk-in'}</dd>
                        <dt>Priority</dt><dd>${s.priority.charAt(0).toUpperCase() + s.priority.slice(1)}</dd>
                        <dt>Status</dt><dd>${s.status.charAt(0).toUpperCase() + s.status.slice(1)}</dd>
                    </div>
                </div>

                ${tests.length > 0 ? `
                <div class="report-section">
                    <h3>Test Results</h3>
                    <table class="result-table">
                        <thead>
                            <tr><th>Test</th><th>Result</th><th>Unit</th><th>Reference Range</th><th>Status</th></tr>
                        </thead>
                        <tbody>
                            ${tests.map(t => `
                                <tr>
                                    <td><strong>${t.test_name}</strong></td>
                                    <td class="${t.flagged ? 'flagged' : ''}">${t.result || '-'}</td>
                                    <td>${t.unit || t.test_unit || '-'}</td>
                                    <td>${t.reference_range || t.reference_text || '-'}</td>
                                    <td>${t.status}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                ` : '<div class="report-section"><p class="text-muted">No tests performed.</p></div>'}

                ${s.notes ? `
                <div class="report-section">
                    <h3>Notes</h3>
                    <p>${s.notes}</p>
                </div>
                ` : ''}

                <div class="report-footer">
                    <div class="d-flex justify-content-between">
                        <div>
                            <div class="signature-line">Authorized Signature</div>
                        </div>
                        <div class="text-end">
                            <p class="mb-0">Report generated: ${formatDateTime(new Date().toISOString())}</p>
                            <p class="mb-0">Lab Software - Confidential</p>
                        </div>
                    </div>
                </div>
            `;
        }

        loadReport();
    </script>
</body>
</html>
