{% extends "base.html" %}
{% block title %}Test Category Form - Seal MW Lab System{% endblock %}
{% block page_title %}Add/Edit Test Category{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <form id="itemForm">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Category Name *</label>
                            <input type="text" class="form-control" id="itemName" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Active</label>
                            <select class="form-select" id="itemActive"><option value="1">Yes</option><option value="0">No</option></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Test Group</label>
                            <select class="form-select" id="itemGroup"><option value="">Select group...</option></select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="itemDesc" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="/test-categories" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    var pathParts = window.location.pathname.split('/');
    var itemId = pathParts[pathParts.length - 1] !== 'form' ? pathParts[pathParts.length - 1] : null;
    async function loadDropdowns() {
        var groups = await apiGet('/test-groups/api');
        var sel = document.getElementById('itemGroup');
        if (groups) groups.forEach(function(g) { sel.innerHTML += '<option value="' + g.id + '">' + g.name + '</option>'; });
    }
    async function loadItem() { if (!itemId) return; var d = await apiGet('/test-categories/api/' + itemId); if (d) { document.getElementById('itemName').value = d.name; document.getElementById('itemDesc').value = d.description || ''; document.getElementById('itemActive').value = d.active; document.getElementById('itemGroup').value = d.group_id || ''; } }
    document.getElementById('itemForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var payload = { name: document.getElementById('itemName').value.trim(), description: document.getElementById('itemDesc').value.trim(), group_id: document.getElementById('itemGroup').value ? parseInt(document.getElementById('itemGroup').value) : null, active: parseInt(document.getElementById('itemActive').value) };
        var res; if (itemId) { res = await apiPut('/test-categories/api/' + itemId, payload); } else { res = await apiPost('/test-categories/api', payload); }
        if (res && res.ok) { showToast('Saved'); window.location.href = '/test-categories'; }
    });
    loadDropdowns(); loadItem();
</script>
{% endblock %}
