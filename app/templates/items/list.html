{% extends "base.html" %}
{% block title %}Items - Seal MW Lab System{% endblock %}
{% block page_title %}Items{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search items..." style="width:300px">
    <a href="/items/form" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Item</a>
</div>
<div class="card"><div class="card-body p-0"><div class="table-responsive">
    <table class="table table-hover mb-0">
        <thead><tr><th>Name</th><th>SKU</th><th>Category</th><th>Price</th><th>Qty</th><th>Supplier</th><th></th></tr></thead>
        <tbody id="listData"></tbody>
    </table>
</div></div></div>
{% endblock %}
{% block extra_js %}
<script>
    async function loadData() {
        var data = await apiGet('/items/api');
        if (!data) return;
        var tbody = document.getElementById('listData');
        if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><p>No items</p></td></tr>'; return; }
        tbody.innerHTML = data.map(function(r) {
            var qtyClass = r.quantity <= r.min_quantity ? 'text-danger fw-bold' : '';
            return '<tr><td><strong>' + r.name + '</strong></td><td>' + (r.sku || '-') + '</td><td>' + (r.category || '-') + '</td><td>' + (r.price ? 'MK ' + Number(r.price).toLocaleString() : 'Not priced') + '</td><td class="' + qtyClass + '">' + r.quantity + '</td><td>' + (r.supplier_name || '-') + '</td><td><a href="/items/form/' + r.id + '" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a><button class="btn btn-sm btn-outline-danger" onclick="deleteItem(' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
        }).join('');
    }
    async function deleteItem(id) { if (await confirmAction('Delete this item?')) { var res = await apiDelete('/items/api/' + id); if (res && res.ok) { showToast('Deleted'); loadData(); } } }
    loadData();
</script>
{% endblock %}
