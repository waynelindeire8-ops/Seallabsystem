{% extends "base.html" %}
{% block title %}Test Form - Lab Software{% endblock %}
{% block page_title %}Add/Edit Test{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <form id="testForm">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Test Name *</label>
                            <input type="text" class="form-control" id="testName" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Category *</label>
                            <select class="form-select" id="testCategory" required>
                                <option value="Hematology">Hematology</option>
                                <option value="Chemistry">Chemistry</option>
                                <option value="Urinalysis">Urinalysis</option>
                                <option value="Coagulation">Coagulation</option>
                                <option value="Immunology">Immunology</option>
                                <option value="Microbiology">Microbiology</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Unit</label>
                            <input type="text" class="form-control" id="testUnit">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Reference Min</label>
                            <input type="number" step="any" class="form-control" id="testRefMin">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Reference Max</label>
                            <input type="number" step="any" class="form-control" id="testRefMax">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Reference Text</label>
                            <input type="text" class="form-control" id="testRefText" placeholder="e.g. WBC: 4.5-11.0, RBC: 4.5-5.5">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Turnaround (hours)</label>
                            <input type="number" class="form-control" id="testTurnaround" value="24">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Price (MK)</label>
                            <input type="number" step="0.01" class="form-control" id="testPrice" value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Active</label>
                            <select class="form-select" id="testActive">
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Test</button>
                        <a href="/catalog" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const pathParts = window.location.pathname.split('/');
    const testId = pathParts[pathParts.length - 1] !== 'form' ? pathParts[pathParts.length - 1] : null;

    async function loadTest() {
        if (!testId) return;
        const data = await apiGet('/catalog/api/' + testId);
        if (!data) return;
        document.getElementById('testName').value = data.name;
        document.getElementById('testCategory').value = data.category;
        document.getElementById('testUnit').value = data.unit || '';
        document.getElementById('testRefMin').value = data.ref_min || '';
        document.getElementById('testRefMax').value = data.ref_max || '';
        document.getElementById('testRefText').value = data.reference_text || '';
        document.getElementById('testTurnaround').value = data.turnaround_hrs;
        document.getElementById('testPrice').value = data.price;
        document.getElementById('testActive').value = data.active;
    }

    document.getElementById('testForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const payload = {
            name: document.getElementById('testName').value.trim(),
            category: document.getElementById('testCategory').value,
            unit: document.getElementById('testUnit').value.trim(),
            ref_min: document.getElementById('testRefMin').value ? parseFloat(document.getElementById('testRefMin').value) : null,
            ref_max: document.getElementById('testRefMax').value ? parseFloat(document.getElementById('testRefMax').value) : null,
            reference_text: document.getElementById('testRefText').value.trim(),
            turnaround_hrs: parseInt(document.getElementById('testTurnaround').value),
            price: parseFloat(document.getElementById('testPrice').value),
            active: parseInt(document.getElementById('testActive').value)
        };

        let res;
        if (testId) {
            res = await apiPut('/catalog/api/' + testId, payload);
        } else {
            res = await apiPost('/catalog/api', payload);
        }
        if (res && res.ok) { showToast('Test saved'); window.location.href = '/catalog'; }
        else { showToast(res?.data?.error || 'Failed to save', 'danger'); }
    });

    loadTest();
</script>
{% endblock %}
