{% extends "base.html" %}
{% block title %}Laboratory Test Form - Seal MW Lab System{% endblock %}
{% block page_title %}Add/Edit Laboratory Test{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <form id="itemForm">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Test Name *</label>
                            <input type="text" class="form-control" id="itemName" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Active</label>
                            <select class="form-select" id="itemActive"><option value="1">Yes</option><option value="0">No</option></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="itemCategory"><option value="">Select...</option></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Specimen</label>
                            <select class="form-select" id="itemSpecimen"><option value="">Select...</option></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Turnaround (hrs)</label>
                            <input type="number" class="form-control" id="itemTurnaround" value="24">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Price (MK)</label>
                            <input type="number" step="0.01" class="form-control" id="itemPrice" value="0">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="itemDesc" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="/lab-tests" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    var pathParts = window.location.pathname.split('/');
    var itemId = pathParts[pathParts.length - 1] !== 'form' ? pathParts[pathParts.length - 1] : null;
    async function loadDropdowns() {
        var cats = await apiGet('/test-categories/api');
        var specs = await apiGet('/specimens/api');
        var catSel = document.getElementById('itemCategory');
        var specSel = document.getElementById('itemSpecimen');
        if (cats) cats.forEach(function(c) { catSel.innerHTML += '<option value="' + c.id + '">' + c.name + '</option>'; });
        if (specs) specs.forEach(function(s) { specSel.innerHTML += '<option value="' + s.id + '">' + s.name + '</option>'; });
    }
    async function loadItem() { if (!itemId) return; var d = await apiGet('/lab-tests/api/' + itemId); if (d) { document.getElementById('itemName').value = d.name; document.getElementById('itemDesc').value = d.description || ''; document.getElementById('itemActive').value = d.active; document.getElementById('itemCategory').value = d.category_id || ''; document.getElementById('itemSpecimen').value = d.specimen_id || ''; document.getElementById('itemTurnaround').value = d.turnaround_hrs; document.getElementById('itemPrice').value = d.price; } }
    document.getElementById('itemForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var payload = { name: document.getElementById('itemName').value.trim(), description: document.getElementById('itemDesc').value.trim(), category_id: document.getElementById('itemCategory').value ? parseInt(document.getElementById('itemCategory').value) : null, specimen_id: document.getElementById('itemSpecimen').value ? parseInt(document.getElementById('itemSpecimen').value) : null, turnaround_hrs: parseInt(document.getElementById('itemTurnaround').value), price: parseFloat(document.getElementById('itemPrice').value), active: parseInt(document.getElementById('itemActive').value) };
        var res; if (itemId) { res = await apiPut('/lab-tests/api/' + itemId, payload); } else { res = await apiPost('/lab-tests/api', payload); }
        if (res && res.ok) { showToast('Saved'); window.location.href = '/lab-tests'; }
    });
    loadDropdowns(); loadItem();
</script>
{% endblock %}
