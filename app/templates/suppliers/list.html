{% extends "base.html" %}
{% block title %}Suppliers - Seal MW Lab System{% endblock %}
{% block page_title %}Suppliers{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search suppliers..." style="width:300px">
    <a href="/suppliers/form" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Supplier</a>
</div>
<div class="card"><div class="card-body p-0"><div class="table-responsive">
    <table class="table table-hover mb-0">
        <thead><tr><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th>Status</th><th></th></tr></thead>
        <tbody id="listData"></tbody>
    </table>
</div></div></div>
{% endblock %}
{% block extra_js %}
<script>
    async function loadData() {
        var data = await apiGet('/suppliers/api');
        if (!data) return;
        var tbody = document.getElementById('listData');
        if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><p>No suppliers</p></td></tr>'; return; }
        tbody.innerHTML = data.map(function(r) {
            return '<tr><td><strong>' + r.name + '</strong></td><td>' + (r.contact_person || '-') + '</td><td>' + (r.phone || '-') + '</td><td>' + (r.email || '-') + '</td><td>' + (r.active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>') + '</td><td><a href="/suppliers/form/' + r.id + '" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a><button class="btn btn-sm btn-outline-danger" onclick="deleteItem(' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
        }).join('');
    }
    async function deleteItem(id) { if (await confirmAction('Delete this supplier?')) { var res = await apiDelete('/suppliers/api/' + id); if (res && res.ok) { showToast('Deleted'); loadData(); } } }
    loadData();
</script>
{% endblock %}
