{% extends "base.html" %}
{% block title %}Test Group Form - Seal MW Lab System{% endblock %}
{% block page_title %}Add/Edit Test Group{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <form id="itemForm">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Group Name *</label>
                            <input type="text" class="form-control" id="itemName" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Active</label>
                            <select class="form-select" id="itemActive"><option value="1">Yes</option><option value="0">No</option></select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="itemDesc" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="/test-groups" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    var pathParts = window.location.pathname.split('/');
    var itemId = pathParts[pathParts.length - 1] !== 'form' ? pathParts[pathParts.length - 1] : null;
    async function loadItem() { if (!itemId) return; var d = await apiGet('/test-groups/api/' + itemId); if (d) { document.getElementById('itemName').value = d.name; document.getElementById('itemDesc').value = d.description || ''; document.getElementById('itemActive').value = d.active; } }
    document.getElementById('itemForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var payload = { name: document.getElementById('itemName').value.trim(), description: document.getElementById('itemDesc').value.trim(), active: parseInt(document.getElementById('itemActive').value) };
        var res; if (itemId) { res = await apiPut('/test-groups/api/' + itemId, payload); } else { res = await apiPost('/test-groups/api', payload); }
        if (res && res.ok) { showToast('Saved'); window.location.href = '/test-groups'; }
    });
    loadItem();
</script>
{% endblock %}
