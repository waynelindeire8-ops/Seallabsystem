{% extends "base.html" %}
{% block title %}Test Groups - Seal MW Lab System{% endblock %}
{% block page_title %}Test Groups{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search groups..." style="width:300px">
    <a href="/test-groups/form" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Group</a>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>Name</th><th>Description</th><th>Status</th><th></th></tr></thead>
                <tbody id="listData"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadData() {
        var data = await apiGet('/test-groups/api');
        if (!data) return;
        var tbody = document.getElementById('listData');
        if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="empty-state"><p>No test groups</p></td></tr>'; return; }
        tbody.innerHTML = data.map(function(r) {
            return '<tr><td><strong>' + r.name + '</strong></td><td>' + (r.description || '-') + '</td><td>' + (r.active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>') + '</td><td><a href="/test-groups/form/' + r.id + '" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a><button class="btn btn-sm btn-outline-danger" onclick="deleteItem(' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
        }).join('');
    }
    async function deleteItem(id) { if (await confirmAction('Delete this group?')) { var res = await apiDelete('/test-groups/api/' + id); if (res && res.ok) { showToast('Deleted'); loadData(); } } }
    loadData();
</script>
{% endblock %}
